<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Tanpura</title>
    <meta name="description" content="A beautiful 3D tanpura drone for singing practice (riyaz)." />
    <meta name="theme-color" content="#120a2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tanpura" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="3D tanpura. Tap a string to pluck it."></canvas>

    <header class="topbar">
      <div class="brand">
        <h1>Tanpura</h1>
        <p>tap a string · drag to look around</p>
      </div>
      <button id="install" class="chip install" hidden>Install app</button>
    </header>

    <main id="panel" class="panel">
      <button id="collapse" class="collapse" aria-label="Hide controls"><span></span></button>

      <section class="now">
        <div class="keyinfo">
          <div id="keyName" class="keyname">A</div>
          <div id="keySub" class="keysub">White 6 · 220.0 Hz</div>
        </div>
        <button id="play" class="play" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.4" /><rect x="13.5" y="5" width="4" height="14" rx="1.4" /></svg>
        </button>
        <div id="strings" class="strings" aria-hidden="true"></div>
      </section>

      <div class="more-body">
        <section>
          <h2>Key <small>(Sa)</small></h2>
          <div id="keyboard" class="keyboard"></div>
        </section>

        <section class="row2">
          <div>
            <h2>Octave</h2>
            <div class="stepper">
              <button id="octDown" aria-label="Lower octave">−</button>
              <span id="octLabel">Medium</span>
              <button id="octUp" aria-label="Higher octave">+</button>
            </div>
          </div>
          <div>
            <h2>First string</h2>
            <div id="first" class="segmented"></div>
          </div>
        </section>

        <details id="moreSettings">
          <summary>More settings</summary>
          <label class="slider">
            <span>Speed <output id="cycleOut"></output></span>
            <input id="cycle" type="range" min="2.5" max="7" step="0.1" />
          </label>
          <label class="slider">
            <span>Volume <output id="volumeOut"></output></span>
            <input id="volume" type="range" min="0" max="1" step="0.01" />
          </label>
          <label class="slider">
            <span>Fine tune <output id="centsOut"></output></span>
            <input id="cents" type="range" min="-50" max="50" step="1" />
          </label>
          <label class="slider">
            <span>Hall echo <output id="reverbOut"></output></span>
            <input id="reverb" type="range" min="0" max="1" step="0.01" />
          </label>
          <div class="timer">
            <h2>Practice timer</h2>
            <div id="timer" class="segmented"></div>
            <div id="timerLeft" class="timer-left"></div>
          </div>
        </details>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
